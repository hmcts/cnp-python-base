name: cd

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 2"   # weekly, Tuesday 00:00 UTC

jobs:
  main:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write   # OIDC login to Azure
      contents: read    # least-privilege for actions/checkout
    strategy:
      matrix:
        type: [distroless, distroless-debug]
    env:
      PYTHON_VERSION: "3.13"
      PROD_ACR: hmctsprod.azurecr.io
      SBOX_ACR: hmctssbox.azurecr.io
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: "Az CLI login"
        uses: azure/login@v3
        with:
          client-id: 0c90bba4-bee6-42d1-8398-dedede1319d1 # DTS Platform Operations GitHub Actions ACR Publisher 2
          tenant-id: 531ff96d-0ae9-462a-8d2d-bec7c0b42082 # HMCTS.NET
          allow-no-subscriptions: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU for Docker
        uses: docker/setup-qemu-action@v4

      # Pre-publish gate: build amd64 (from the SBOX base) and smoke test before any push.
      - name: "ACR Login - HMCTSSBOX"
        run: az acr login --name hmctssbox

      - name: "Build amd64 image and smoke test (pre-publish gate)"
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.type }}
          load: true
          platforms: linux/amd64
          build-args: |
            BASE_REGISTRY=${{ env.SBOX_ACR }}
          tags: base/python:cd-${{ matrix.type }}

      - name: "Smoke test"
        run: ./test/smoke-test.sh base/python:cd-${{ matrix.type }}

      ###################################################
      # HMCTSPROD ACR - release (default branch only)
      ###################################################
      - name: "ACR Login - HMCTSPROD"
        run: az acr login --name hmctsprod

      - name: "Build and Push - PROD - ${{ matrix.type }}"
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.type }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_REGISTRY=${{ env.PROD_ACR }}
          tags: ${{ env.PROD_ACR }}/base/python:${{ env.PYTHON_VERSION }}-${{ matrix.type }}

      ###################################################
      # HMCTSSBOX ACR - release
      ###################################################
      - name: "Build and Push - SBOX - ${{ matrix.type }}"
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.type }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_REGISTRY=${{ env.SBOX_ACR }}
          tags: ${{ env.SBOX_ACR }}/base/python:${{ env.PYTHON_VERSION }}-${{ matrix.type }}
