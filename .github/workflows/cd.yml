name: cd

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Registries to publish to"
        type: choice
        options: [both, sbox, prod]
        default: both
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 2"

jobs:
  main:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    strategy:
      matrix:
        type: [distroless, distroless-debug]
    env:
      PYTHON_VERSION: "3.13"
      PROD_ACR: hmctsprod.azurecr.io
      SBOX_ACR: hmctssbox.azurecr.io
      TARGET: ${{ github.event.inputs.target || 'both' }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: "Az CLI login"
        uses: azure/login@v3
        with:
          client-id: c6a3a50b-762f-4b4f-b7ec-f1d84be20cef # DTS Platform Operations GitHub Actions ACR Publisher 1
          tenant-id: 531ff96d-0ae9-462a-8d2d-bec7c0b42082 # HMCTS.NET
          allow-no-subscriptions: true

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.2.0
        with:
          dockerfile: ./${{ matrix.type }}/Dockerfile

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU for Docker
        uses: docker/setup-qemu-action@v4

      - name: "ACR Login - HMCTSPROD"
        run: az acr login --name hmctsprod

      - name: "Build amd64 image and smoke test (pre-publish gate)"
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.type }}
          load: true
          platforms: linux/amd64
          tags: base/python:cd-${{ matrix.type }}

      - name: "Smoke test"
        run: ./test/smoke-test.sh base/python:cd-${{ matrix.type }}

      - name: "ACR Login - HMCTSSBOX"
        if: env.TARGET == 'both' || env.TARGET == 'sbox'
        run: az acr login --name hmctssbox

      - name: "Build and Push - SBOX - ${{ matrix.type }}"
        if: env.TARGET == 'both' || env.TARGET == 'sbox'
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.type }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.SBOX_ACR }}/base/python:${{ env.PYTHON_VERSION }}-${{ matrix.type }}

      - name: "Build and Push - PROD - ${{ matrix.type }}"
        if: env.TARGET == 'both' || env.TARGET == 'prod'
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.type }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.PROD_ACR }}/base/python:${{ env.PYTHON_VERSION }}-${{ matrix.type }}
